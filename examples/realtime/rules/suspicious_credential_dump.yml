title: Suspicious Credential Dumping Tool
id: 5f1e0a2b-3c4d-4e5f-8a9b-0c1d2e3f4a5b
status: test
description: Detects process creation of well-known credential dumping tools such as Mimikatz or procdump targeting lsass.
author: you
date: 2026-11-10
level: high

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4688
    CommandLine|contains:
      - mimikatz
      - sekurlsa
      - 'procdump -ma'
  condition: selection

falsepositives:
  - Authorized red team exercises
  - Legacy administrative tooling

tags:
  - attack.credential-access
  - attack.t1003.001

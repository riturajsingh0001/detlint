title: Failed Logon From Service Account
id: 1e6b4a90-7c2d-4b55-8f30-5a9d3c1e8b05
description: Failed logons where the target account ends in $.
level: medium
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    TargetUserName|endswith: '$'
  condition: selection and not filter_known
tags:
  - attack.credential-access
  - attack.t1110

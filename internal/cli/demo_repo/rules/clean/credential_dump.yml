title: LSASS Memory Access
id: 3c9a0d44-2b7f-4e1c-8a55-9f6d2e1b7c02
status: stable
description: Detects process access to lsass.exe consistent with credential dumping.
author: detlint demo
level: critical
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectName|endswith: '\lsass.exe'
    AccessMask|contains:
      - '0x1010'
      - '0x1410'
  condition: selection
falsepositives:
  - Endpoint protection products
tags:
  - attack.credential-access
  - attack.t1003.001
